<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ozon 选品库 · 商品搜索</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="picks.css">
</head>
<body class="picks-body">
  <header class="picks-header">
    <div class="brand">
      <span class="eyebrow">PRODUCT DISCOVERY</span>
      <h1>OZON<span>//</span>选品库</h1>
    </div>
    <nav class="tabs">
      <a href="/">数据终端</a>
      <a class="active" href="/picks.html">选品库</a>
    </nav>
    <div class="health">
      <span id="cookieDot" class="dot"></span>
      <span id="cookieText">检查中…</span>
      <button id="pasteBtn" class="ghost">粘贴 Cookie</button>
    </div>
  </header>
  <main class="picks-main">
    <aside class="picks-rail">
      <div id="statusBar" class="status-bar loading">正在检查本地服务状态…</div>
      <h2>批量检索</h2>
      <label>关键词列表
        <textarea id="keywords" rows="8" placeholder="每行一个关键词，例如：\n连衣裙\nботинки\nплатье"></textarea>
      </label>
      <label>搜索页数
        <select id="pages">
          <option value="1">1 页</option>
          <option value="3" selected>3 页</option>
          <option value="5">5 页</option>
          <option value="10">10 页</option>
          <option value="20">20 页</option>
        </select>
      </label>
      <label>每个关键词最多返回
        <input id="target" type="number" min="5" max="2000" value="120">
      </label>
      <button id="searchBtn" class="primary">批量开始搜索</button>
      <p class="hint" id="hint">首次使用请先粘贴 Ozon Cookie Header。搜索结果按关键词分组，默认展示每组前 5 个商品。</p>
    </aside>
    <section class="picks-results">
      <div class="results-head">
        <div>
          <span class="eyebrow">BATCH RESULTS</span>
          <h2 id="resultTitle">输入关键词开始检索</h2>
        </div>
        <div class="result-meta" id="resultMeta"></div>
      </div>
      <div id="groups" class="groups empty">暂无结果</div>
    </section>
  </main>
  <dialog id="resultsDialog" class="results-dialog">
    <div class="dialog-head">
      <div>
        <span class="eyebrow">KEYWORD RESULTS</span>
        <h3 id="dialogTitle">商品结果</h3>
      </div>
      <button id="closeResults" class="icon-close" type="button" aria-label="关闭">×</button>
    </div>
    <div id="dialogMeta" class="dialog-meta"></div>
    <div id="dialogGrid" class="dialog-grid"></div>
  </dialog>
  <dialog id="cookieDialog">
    <form method="dialog">
      <h3>粘贴 Ozon Cookie Header</h3>
      <p>在已登录 Ozon 的标签页按 F12 → Network → 任意请求 → 复制 <b>Cookie</b> 请求头整段。</p>
      <textarea id="cookieTextarea" rows="6" placeholder="x-hng=...; _nano_fp=...; ..."></textarea>
      <menu>
        <button value="cancel" class="ghost">取消</button>
        <button value="ok" class="primary" id="uploadBtn">上传</button>
      </menu>
    </form>
  </dialog>
  <script src="picks.js"></script>
</body>
</html>
