[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-data-terminal"
version = "0.1.0"
description = "Local Ozon sequential collector with resumable jobs"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "browser-cookie3>=0.19,<1",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
mcp = ["mcp>=1.10,<2"]

[project.scripts]
ozon-terminal = "ozon_terminal.cli:app"

[tool.setuptools.packages.find]
include = ["ozon_terminal*"]

[tool.setuptools.package-data]
ozon_terminal = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
